<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Telkom Digital Hub</title>
<style>
  :root {
    --dark: #111111;
    --light: #f0f0f2;
    --ink: #140101;
  }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--dark);
  }
  body.idle { cursor: none; }

  /* Light background that floods out of the door */
  #flood {
    position: fixed;
    inset: 0;
    background: var(--light);
    visibility: hidden;
  }

  /* Stage = the Figma frame (3434 x 1751), scaled to fit the screen */
  #stage {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 3434px;
    height: 1751px;
    transform-origin: center;
  }

  #logo {
    position: absolute;
    left: 611px;
    top: 631px;
    width: 450px;
    height: 489.824px;
    transform-origin: 225px 245px;
    opacity: 0;
    z-index: 2;
    will-change: transform, opacity, filter;
  }
  #textWrap { position: absolute; inset: 0; z-index: 1; }
  #logo svg { display: block; overflow: visible; }

  /* wordmark, outlined from Timeless Sans Bold so no font file is needed */
  .t {
    position: absolute;
    left: 1165.32px;
    display: block;
    overflow: visible;
    opacity: 0;
    will-change: transform, opacity, filter;
  }
  #tTelkom { top: 599.48px; }
  #tHub    { top: 763.38px; }
</style>
</head>

<script>
(() => {
  const STAGE_W = 3434, STAGE_H = 1751;
  const SHIFT = 881;                 // scene 1 D sits centered at x=1492; final logo at x=611
  const SPARKLE_C = [137.61, 281.51];
  const GAP_POINT = [292, 300];      // where the light floods from (logo coords)

  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), logo = $("logo"), flood = $("flood");
  const leaf = $("leafGeom"), grad = $("grad"), doorLight = $("doorLight");
  const bloomS = $("bloomS"), bloomL = $("bloomL"), sheen = $("sheen");
  const sparkle = $("sparkle"), sparkleGlow = $("sparkleGlow");
  const minis = [...document.querySelectorAll(".mini")];
  const tTelkom = $("tTelkom"), tHub = $("tHub"), textWrap = $("textWrap");

  // ---------- easing ----------
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const lerp = (a, b, k) => a + (b - a) * k;
  const outCubic = (x) => 1 - Math.pow(1 - x, 3);
  const inOutCubic = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const outBack = (x, c = 1.9) => 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2);
  const bump = (x) => Math.sin(Math.PI * clamp(x));

  // ---------- door leaf geometry ----------
  // Closed: the leaf fills the doorway so frame + leaf = the solid D of scene 1.
  // Open:   the leaf matches the open door from the Figma logo.
  const LEAF_CLOSED = {
    start: [0, 66.19],
    segs: [
      ["L", [263.5, 82.6]],
      ["C", [292, 86.2], [314, 103.5], [315.6, 139.7]],
      ["L", [314.107, 451.816]],
      ["C", [282.287, 466.41], [246.662, 474.022], [209.22, 472.73]],
      ["L", [3.1377, 465.628]],
      ["L", [0, 465.518]],
    ],
  };
  const LEAF_OPEN = {
    start: [0, 66.19],
    segs: [
      ["L", [236.396, 112.5]],
      ["C", [251.5, 115.5], [264.5, 124], [265.491, 145.474]],
      ["L", [271.252, 489.824]],
      ["L", [180.824, 481.662]],
      ["L", [3.1377, 465.625]],
      ["L", [0, 465.518]],
    ],
  };
  // Turn every segment into a cubic so both shapes can be blended point by point.
  function toCubics(shape) {
    let p = shape.start;
    const out = [p];
    for (const s of shape.segs) {
      if (s[0] === "L") {
        const e = s[1];
        out.push([lerp(p[0], e[0], 1 / 3), lerp(p[1], e[1], 1 / 3)],
                 [lerp(p[0], e[0], 2 / 3), lerp(p[1], e[1], 2 / 3)], e);
        p = e;
      } else {
        out.push(s[1], s[2], s[3]);
        p = s[3];
      }
    }
    return out;
  }
  const PC = toCubics(LEAF_CLOSED), PO = toCubics(LEAF_OPEN);
  const f = (n) => n.toFixed(3);

  function setDoor(k) {
    const pts = PC.map((c, i) => [lerp(c[0], PO[i][0], k), lerp(c[1], PO[i][1], k)]);
    let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
    for (let i = 1; i < pts.length; i += 3) {
      d += `C${f(pts[i][0])} ${f(pts[i][1])} ${f(pts[i + 1][0])} ${f(pts[i + 1][1])} ${f(pts[i + 2][0])} ${f(pts[i + 2][1])}`;
    }
    leaf.setAttribute("d", d + "Z");
    // gradient: scene 1 values -> scene 2 values
    grad.setAttribute("y1", f(lerp(96.06, 99.5, k)));
    grad.setAttribute("x2", f(lerp(-9.24, -22.5, k)));
    grad.setAttribute("y2", f(lerp(472.82, 477, k)));
  }

  // ---------- layout ----------
  let S = 1;
  function fit() {
    S = Math.min(innerWidth / STAGE_W, innerHeight / STAGE_H);
    stage.style.transform = `translate(-50%, -50%) scale(${S})`;
  }
  const toScreen = (sx, sy) => [innerWidth / 2 + (sx - STAGE_W / 2) * S, innerHeight / 2 + (sy - STAGE_H / 2) * S];

  function setText(el, p) {
    el.style.opacity = p;
    el.style.transform = `translateX(${(1 - p) * -110}px)`;
    el.style.filter = p < 1 ? `blur(${(1 - p) * 14}px)` : "none";
  }

  const MINI = [
    { x: 228, y: 212, size: 20, at: 3.95 },
    { x: 62, y: 396, size: 15, at: 4.07 },
    { x: 212, y: 398, size: 13, at: 4.19 },
  ];
  const MINI_FINALE = [6.0, 6.1, 6.2];

  // ---------- timeline (seconds) ----------
  //  0.3 - 1.3  D appears (scene 1)
  //  1.2 - 2.1  sheen across the D
  //  2.3 - 2.6  door cracks open, light peeks through
  //  2.8 - 3.6  door swings open
  //  3.2 - 4.4  light floods the screen (dark -> light)
  //  3.75- 4.35 sparkle appears on the door
  //  4.3 - 5.3  logo moves left, text comes in
  //  5.7 - 6.6  final sheen + sparkle twinkle
  const END = 6.8;

  function render(t) {
    // D enter
    const pe = outCubic(prog(t, 0.3, 1.3));
    const ps = inOutCubic(prog(t, 4.3, 5.3));
    const dx = lerp(SHIFT, 0, ps);
    const sc = lerp(0.88, 1, pe);
    logo.style.opacity = pe;
    logo.style.transform = `translateX(${dx}px) scale(${sc})`;
    logo.style.filter = pe < 1 ? `blur(${(1 - pe) * 14}px)` : "none";

    // door
    const crack = outCubic(prog(t, 2.3, 2.6)) * 0.14;
    const swing = inOutCubic(prog(t, 2.8, 3.6));
    setDoor(crack + 0.86 * swing);

    // light through the door
    const lightIn = prog(t, 2.3, 2.6);
    const lightOut = prog(t, 3.9, 4.5);
    doorLight.setAttribute("opacity", lightIn * (1 - lightOut));
    bloomS.setAttribute("opacity", (0.7 * outCubic(lightIn) + 0.3 * swing) * (1 - lightOut));
    bloomL.setAttribute("opacity", (0.4 * lightIn + 0.6 * swing) * (1 - lightOut));

    // flood: background turns light, spreading out from the door
    const pf = inOutCubic(prog(t, 3.2, 4.4));
    if (pf <= 0) {
      flood.style.visibility = "hidden";
    } else {
      flood.style.visibility = "visible";
      if (pf >= 1) {
        flood.style.webkitMaskImage = flood.style.maskImage = "none";
      } else {
        const [gx, gy] = toScreen(611 + dx + GAP_POINT[0], 631 + GAP_POINT[1]);
        const far = Math.max(
          Math.hypot(gx, gy), Math.hypot(innerWidth - gx, gy),
          Math.hypot(gx, innerHeight - gy), Math.hypot(innerWidth - gx, innerHeight - gy)
        );
        const r = pf * far * 1.05;
        const feather = 40 + r * 0.35;
        const m = `radial-gradient(circle at ${gx}px ${gy}px, #000 ${r}px, transparent ${r + feather}px)`;
        flood.style.webkitMaskImage = flood.style.maskImage = m;
      }
    }

    // sheen (scene 1, and once more at the end)
    const sh1 = prog(t, 1.2, 2.1), sh2 = prog(t, 5.7, 6.6);
    const sh = sh2 > 0 ? sh2 : sh1;
    const shOn = (sh1 > 0 && sh1 < 1) || (sh2 > 0 && sh2 < 1);
    sheen.setAttribute("opacity", shOn ? (sh2 > 0 ? 0.6 : 1) : 0);
    sheen.setAttribute("transform", `translate(${lerp(-160, 620, inOutCubic(sh))} 0) skewX(-22)`);

    // sparkle
    const pop = prog(t, 3.75, 4.35);
    const tw = prog(t, 5.85, 6.45);
    const sScale = (pop <= 0 ? 0 : outBack(pop)) * (1 + 0.16 * bump(tw));
    const sRot = lerp(-150, 0, outCubic(pop)) + 90 * outCubic(tw);
    sparkle.setAttribute("opacity", clamp(pop * 5));
    sparkle.setAttribute("transform",
      `translate(${SPARKLE_C[0]} ${SPARKLE_C[1]}) rotate(${sRot}) scale(${Math.max(sScale, 0.0001)}) translate(${-SPARKLE_C[0]} ${-SPARKLE_C[1]})`);
    sparkleGlow.setAttribute("opacity", Math.max(bump(pop * 1.4), bump(tw)));

    // twinkle particles
    MINI.forEach((m, i) => {
      const a = prog(t, m.at, m.at + 0.6), b = prog(t, MINI_FINALE[i], MINI_FINALE[i] + 0.5);
      const k = Math.max(bump(a), bump(b));
      const rot = 90 * (a > 0 && a < 1 ? a : b);
      minis[i].setAttribute("opacity", k);
      minis[i].setAttribute("transform", `translate(${m.x} ${m.y}) rotate(${rot}) scale(${m.size * (0.2 + 0.8 * k)})`);
    });

    // text: hidden left of the D's body, so it slides out from behind it
    textWrap.style.clipPath = ps < 1 ? `inset(-200px -200px -200px ${611 + dx + 330}px)` : "none";
    setText(tTelkom, outCubic(prog(t, 4.45, 5.35)));
    setText(tHub, outCubic(prog(t, 4.55, 5.5)));
  }

  // ---------- playback ----------
  let t0 = 0, raf = 0;
  function frame(now) {
    const t = (now - t0) / 1000;
    render(t);
    if (t < END) raf = requestAnimationFrame(frame);
  }
  function play() {
    cancelAnimationFrame(raf);
    render(0);
    t0 = performance.now();
    raf = requestAnimationFrame(frame);
  }

  fit();
  addEventListener("resize", () => { fit(); });
  render(0);

  // #t=3.2 freezes the animation at that second (for checking a single frame)
  const frozen = location.hash.match(/t=([\d.]+)/);
  if (frozen) render(parseFloat(frozen[1]));
  else play();

  // R = replay, F = full screen
  addEventListener("keydown", (e) => {
    if (e.key === "r" || e.key === "R") play();
    if (e.key === "f" || e.key === "F") {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen?.();
    }
  });

  // hide the cursor when the mouse is still
  let idleTimer;
  addEventListener("mousemove", () => {
    document.body.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add("idle"), 1500);
  });
})();
</script>
</body>
</html>
