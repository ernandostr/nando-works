<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Telkom Digital Hub</title>
<style>
  :root {
    --dark: #111111;
    --light: #f0f0f2;
  }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--dark);
  }
  body.idle { cursor: none; }

  /* Light background, switched on once the flood has covered the screen */
  #bgLight {
    position: fixed;
    inset: 0;
    background: var(--light);
    opacity: 0;
  }

  /* Stage keeps the Figma frame's proportions (3434 x 1751) but is laid out at the real
     screen size, so every layer is drawn at the resolution it is shown at.
     All positions below are percentages of Figma coordinates. */
  #stage {
    position: fixed;
    left: 50%;
    top: 50%;
    width: min(100vw, calc(100vh * 3434 / 1751));
    aspect-ratio: 3434 / 1751;
    transform: translate(-50%, -50%);
  }
  @supports (height: 100dvh) {
    #stage { width: min(100vw, calc(100dvh * 3434 / 1751)); }
  }
  .abs { position: absolute; }
  .fill {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  /* Light that floods out of the door: a soft circle that only scales (GPU-friendly) */
  #flood {
    left: 51.951%;
    top: 53.169%;
    border-radius: 50%;
    background: radial-gradient(closest-side, var(--light) 72%, rgba(240, 240, 242, 0) 100%);
    transform: scale(0.001);
  }

  /* Wordmark sits behind the D. The clip window moves with the D while the text inside
     moves the other way, so the text appears to slide out from behind the D. */
  #textClip { left: 27.4024%; top: 0; width: 72.5976%; height: 100%; overflow: hidden; }
  #textInner { position: absolute; inset: 0; }
  .t { position: absolute; display: block; overflow: visible; opacity: 0; }
  #tTelkom { left: 8.998%; top: 34.2364%; width: 21.7144%; height: 11.9338%; }
  #tHub    { left: 8.998%; top: 43.5968%; width: 66.1211%; height: 23.2707%; }

  /* Logo box = Figma logo (x 611, y 631, 450 x 489.824) */
  #logoPos { left: 17.7927%; top: 36.0366%; width: 13.1042%; height: 27.974%; }
  #logoEnter { position: absolute; inset: 0; opacity: 0; }
  #doorLight { opacity: 0; }

  .sheen {
    position: absolute;
    inset: 0;
    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
  }
  .band {
    position: absolute;
    top: -20%;
    left: 0;
    width: 40%;
    height: 140%;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0));
    transform: translateX(-140%) skewX(-22deg);
  }
  #sheen2 { opacity: 0.6; }

  /* Glow from the door gap: static soft gradients, only their opacity animates */
  .glow { position: absolute; opacity: 0; }
  #bloomS {
    left: 53.778%; top: 15.312%; width: 22.222%; height: 81.661%;
    background: radial-gradient(closest-side, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.5) 45%, rgba(255, 255, 255, 0));
  }
  #bloomL {
    left: 31.556%; top: 0%; width: 66.667%; height: 114.327%;
    background: radial-gradient(closest-side, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0));
  }

  /* Sparkle box = its Figma bounds inside the logo */
  #sparkle { left: 14.196%; top: 42.419%; width: 32.769%; height: 30.105%; opacity: 0; }
  #spScale, #spTw { position: absolute; inset: 0; }
  #sparkleGlow { opacity: 0; }
  .mini { position: absolute; opacity: 0; }
</style>
</head>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), flood = $("flood"), leaf = $("leaf"), grad = $("grad");

  // ---------- geometry (logo coordinates, 450 x 489.824, from Figma) ----------
  const FRAME = "M217.241 0C345.79 0 450 104.21 450 232.759V240.111C450 334.336 394.114 415.13 314.107 451.816L312.284 139.655C310.5 105 292 89.0002 265.732 85.3447L58.1895 77.5859L0 75.42V0H217.241Z";
  const CLOSED_D = "M217.241 0C345.79 0 450 104.21 450 232.759V240.111C450 371.8 340.83 477.27 209.22 472.73L0 465.518V0H217.241Z";
  const OPEN_LEAF = "M0 66.19L236.396 112.5C251.5 115.5 264.5 124 265.491 145.474L271.252 489.824L3.1377 465.625L0 465.518Z";
  $("frame").setAttribute("d", FRAME);

  // Door leaf: closed (fills the D, scene 1) -> open (Figma logo)
  const LEAF_CLOSED = {
    start: [0, 66.19],
    segs: [
      ["L", [263.5, 82.6]],
      ["C", [292, 86.2], [314, 103.5], [315.6, 139.7]],
      ["L", [314.107, 451.816]],
      ["C", [282.287, 466.41], [246.662, 474.022], [209.22, 472.73]],
      ["L", [3.1377, 465.628]],
      ["L", [0, 465.518]],
    ],
  };
  const LEAF_OPEN = {
    start: [0, 66.19],
    segs: [
      ["L", [236.396, 112.5]],
      ["C", [251.5, 115.5], [264.5, 124], [265.491, 145.474]],
      ["L", [271.252, 489.824]],
      ["L", [180.824, 481.662]],
      ["L", [3.1377, 465.625]],
      ["L", [0, 465.518]],
    ],
  };
  const lerp = (a, b, k) => a + (b - a) * k;
  function toCubics(shape) {
    let p = shape.start;
    const out = [p];
    for (const s of shape.segs) {
      if (s[0] === "L") {
        const e = s[1];
        out.push([lerp(p[0], e[0], 1 / 3), lerp(p[1], e[1], 1 / 3)], [lerp(p[0], e[0], 2 / 3), lerp(p[1], e[1], 2 / 3)], e);
        p = e;
      } else {
        out.push(s[1], s[2], s[3]);
        p = s[3];
      }
    }
    return out;
  }
  const PC = toCubics(LEAF_CLOSED), PO = toCubics(LEAF_OPEN);
  const f = (n) => n.toFixed(2);
  let lastK = -1;
  function setDoor(k) {
    if (k === lastK) return;   // nothing to redraw
    lastK = k;
    const pts = PC.map((c, i) => [lerp(c[0], PO[i][0], k), lerp(c[1], PO[i][1], k)]);
    let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
    for (let i = 1; i < pts.length; i += 3) {
      d += `C${f(pts[i][0])} ${f(pts[i][1])} ${f(pts[i + 1][0])} ${f(pts[i + 1][1])} ${f(pts[i + 2][0])} ${f(pts[i + 2][1])}`;
    }
    leaf.setAttribute("d", d + "Z");
    grad.setAttribute("y1", f(lerp(96.06, 99.5, k)));
    grad.setAttribute("x2", f(lerp(-9.24, -22.5, k)));
    grad.setAttribute("y2", f(lerp(472.82, 477, k)));
  }

  // Sheen masks: closed D for scene 1, open logo for the finale
  const maskURI = (paths) => `url("data:image/svg+xml,${encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 489.824" preserveAspectRatio="none">${paths.map((d) => `<path d="${d}"/>`).join("")}</svg>`
  )}")`;
  for (const [id, paths] of [["sheen1", [CLOSED_D]], ["sheen2", [FRAME, OPEN_LEAF]]]) {
    const el = $(id), m = maskURI(paths);
    el.style.webkitMaskImage = m;
    el.style.maskImage = m;
  }

  // Twinkle particles (logo coordinates)
  const MINIS = [
    { x: 228, y: 212, size: 20, at: 3.95, again: 6.0 },
    { x: 62, y: 396, size: 15, at: 4.07, again: 6.1 },
    { x: 212, y: 398, size: 13, at: 4.19, again: 6.2 },
  ];
  const STAR = "M0 -1C0.07 -0.24 0.24 -0.07 1 0C0.24 0.07 0.07 0.24 0 1C-0.07 0.24 -0.24 0.07 -1 0C-0.24 -0.07 -0.07 -0.24 0 -1Z";
  const logoEnter = $("logoEnter");
  for (const m of MINIS) {
    const el = document.createElement("div");
    el.className = "mini";
    el.style.left = `${((m.x - m.size) / 450) * 100}%`;
    el.style.top = `${((m.y - m.size) / 489.824) * 100}%`;
    el.style.width = `${((2 * m.size) / 450) * 100}%`;
    el.style.height = `${((2 * m.size) / 489.824) * 100}%`;
    el.innerHTML =
      `<svg class="fill" viewBox="-1 -1 2 2" xmlns="http://www.w3.org/2000/svg">` +
      `<defs><filter id="mg${m.size}" filterUnits="userSpaceOnUse" x="-3" y="-3" width="6" height="6"><feGaussianBlur stdDeviation="0.3"/></filter></defs>` +
      `<path d="${STAR}" fill="#fff" opacity="0.6" filter="url(#mg${m.size})"/><path d="${STAR}" fill="#fff"/></svg>`;
    logoEnter.appendChild(el);
    m.el = el;
  }

  // Flood circle must reach the farthest corner of the screen
  function fitFlood() {
    const r = stage.getBoundingClientRect();
    const gx = r.left + r.width * 0.51951, gy = r.top + r.height * 0.53169;
    const far = Math.max(
      Math.hypot(gx, gy), Math.hypot(innerWidth - gx, gy),
      Math.hypot(gx, innerHeight - gy), Math.hypot(innerWidth - gx, innerHeight - gy)
    );
    const R = Math.ceil(far / 0.72) + 4;
    flood.style.width = flood.style.height = `${2 * R}px`;
    flood.style.marginLeft = flood.style.marginTop = `${-R}px`;
  }

  // ---------- timeline (seconds) ----------
  //  0.3 - 1.3  D appears (scene 1)
  //  1.2 - 2.1  sheen across the D
  //  2.3 - 2.6  door cracks open, light peeks through
  //  2.8 - 3.6  door swings open
  //  3.2 - 4.4  light floods the screen (dark -> light)
  //  3.75- 4.35 sparkle appears on the door
  //  4.3 - 5.3  logo moves left, text slides out from behind it
  //  5.7 - 6.6  final sheen + sparkle twinkle
  // Everything except the door shape runs as Web Animations on transform/opacity/filter,
  // which the browser can hand to the GPU instead of redrawing each frame.
  const E = {
    out: "cubic-bezier(0.33, 1, 0.68, 1)",
    inOut: "cubic-bezier(0.65, 0, 0.35, 1)",
    back: "cubic-bezier(0.34, 1.7, 0.64, 1)",
    sine: "cubic-bezier(0.37, 0, 0.63, 1)",
  };
  let anims = [];
  function A(el, keyframes, start, dur, easing = "linear", fill = "both") {
    const a = el.animate(keyframes, { delay: start * 1000, duration: dur * 1000, easing, fill });
    anims.push(a);
    return a;
  }

  function build() {
    anims.forEach((a) => a.cancel());
    anims = [];
    const S = stage.getBoundingClientRect().width / 3434;   // screen px per Figma px
    const blur = (n) => `blur(${(n * S).toFixed(2)}px)`;
    const bands = document.querySelectorAll(".band");
    const sweep = [{ transform: "translateX(-140%) skewX(-22deg)" }, { transform: "translateX(300%) skewX(-22deg)" }];

    // scene 1: D appears, sheen
    A(logoEnter, [
      { opacity: 0, transform: "scale(0.88)", filter: blur(14) },
      { opacity: 1, transform: "scale(1)", filter: "blur(0px)" },
    ], 0.3, 1.0, E.out);
    A(bands[0], sweep, 1.2, 0.9, E.inOut, "none");

    // door light + glow (offsets are fractions of 2.3s -> 4.5s)
    A($("doorLight"), [
      { opacity: 0 }, { opacity: 1, offset: 0.136 }, { opacity: 1, offset: 0.727 }, { opacity: 0 },
    ], 2.3, 2.2);
    const glow = (peakCrack, shift) => [
      { opacity: 0, transform: `translateX(${shift}%)`, easing: E.out },
      { opacity: peakCrack, transform: `translateX(${shift}%)`, offset: 0.136 },
      { opacity: peakCrack, transform: `translateX(${shift}%)`, offset: 0.227, easing: E.inOut },
      { opacity: 1, transform: "translateX(0%)", offset: 0.591 },
      { opacity: 1, transform: "translateX(0%)", offset: 0.727 },
      { opacity: 0, transform: "translateX(0%)" },
    ];
    A($("bloomS"), glow(0.7, 18), 2.3, 2.2);
    A($("bloomL"), glow(0.4, 6), 2.3, 2.2);

    // light floods the screen
    A(flood, [{ transform: "scale(0.001)" }, { transform: "scale(1)" }], 3.2, 1.2, E.inOut);
    A($("bgLight"), [{ opacity: 0 }, { opacity: 1 }], 4.4, 0.05);

    // sparkle
    A($("sparkle"), [
      { opacity: 0, transform: "rotate(-150deg)" },
      { opacity: 1, transform: "rotate(-120deg)", offset: 0.2 },
      { opacity: 1, transform: "rotate(0deg)" },
    ], 3.75, 0.6, E.out);
    A($("spScale"), [{ transform: "scale(0.001)" }, { transform: "scale(1)" }], 3.75, 0.6, E.back);
    A($("spTw"), [
      { transform: "rotate(0deg) scale(1)" },
      { transform: "rotate(45deg) scale(1.16)", offset: 0.5 },
      { transform: "rotate(90deg) scale(1)" },
    ], 5.85, 0.6, E.out);
    const bump = [{ opacity: 0 }, { opacity: 1, easing: E.sine }, { opacity: 0 }];
    A($("sparkleGlow"), bump, 3.75, 0.43, E.sine, "none");
    A($("sparkleGlow"), bump, 5.85, 0.6, E.sine, "none");
    const twinkle = [
      { opacity: 0, transform: "rotate(0deg) scale(0.2)", easing: E.sine },
      { opacity: 1, transform: "rotate(45deg) scale(1)", easing: E.sine },
      { opacity: 0, transform: "rotate(90deg) scale(0.2)" },
    ];
    for (const m of MINIS) {
      A(m.el, twinkle, m.at, 0.6, "linear", "none");
      A(m.el, twinkle, m.again, 0.5, "linear", "none");
    }

    // logo moves left; the text window follows it, the text itself stays put
    A($("logoPos"), [{ transform: "translateX(195.778%)" }, { transform: "translateX(0%)" }], 4.3, 1.0, E.inOut);
    A($("textClip"), [{ transform: "translateX(35.339%)" }, { transform: "translateX(0%)" }], 4.3, 1.0, E.inOut);
    A($("textInner"), [{ transform: "translateX(-35.339%)" }, { transform: "translateX(0%)" }], 4.3, 1.0, E.inOut);
    A($("tTelkom"), [
      { opacity: 0, transform: "translateX(-20.32%)", filter: blur(14) },
      { opacity: 1, transform: "translateX(0%)", filter: "blur(0px)" },
    ], 4.45, 0.9, E.out);
    A($("tHub"), [
      { opacity: 0, transform: "translateX(-6.673%)", filter: blur(14) },
      { opacity: 1, transform: "translateX(0%)", filter: "blur(0px)" },
    ], 4.55, 0.95, E.out);

    // finale sheen
    A(bands[1], sweep, 5.7, 0.9, E.inOut, "none");
  }

  // Door shape follows the same clock (only redrawn while the door moves)
  const clamp = (v) => Math.min(1, Math.max(0, v));
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const outCubic = (x) => 1 - Math.pow(1 - x, 3);
  const inOutCubic = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const doorAt = (t) => outCubic(prog(t, 2.3, 2.6)) * 0.14 + 0.86 * inOutCubic(prog(t, 2.8, 3.6));

  let T0 = 0, raf = 0;
  function tick() {
    const t = (document.timeline.currentTime - T0) / 1000;
    setDoor(doorAt(t));
    if (t < 3.7) raf = requestAnimationFrame(tick);
  }
  // warmup: on first load the clock starts a little later, so the browser can prepare
  // every layer while the screen is still dark (otherwise the first frames stutter)
  function play(warmup = 0) {
    cancelAnimationFrame(raf);
    fitFlood();
    build();
    lastK = -1;
    setDoor(0);
    T0 = document.timeline.currentTime + warmup;
    anims.forEach((a) => (a.startTime = T0));   // one shared clock for every layer
    raf = requestAnimationFrame(tick);
  }
  function freeze(t) {
    fitFlood();
    build();
    anims.forEach((a) => { a.pause(); a.currentTime = t * 1000; });
    lastK = -1;
    setDoor(doorAt(t));
  }

  addEventListener("resize", fitFlood);

  // #t=3.2 freezes the animation at that second (for checking a single frame)
  const frozen = location.hash.match(/t=([\d.]+)/);
  if (frozen) freeze(parseFloat(frozen[1]));
  else play(400);

  // R = replay, F = full screen
  addEventListener("keydown", (e) => {
    if (e.key === "r" || e.key === "R") play();
    if (e.key === "f" || e.key === "F") {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen?.();
    }
  });

  // hide the cursor when the mouse is still
  let idleTimer = setTimeout(() => document.body.classList.add("idle"), 1500);
  addEventListener("mousemove", () => {
    document.body.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add("idle"), 1500);
  });
})();
</script>
</body>
</html>
